name: Release

# When a pull request is merged into main, cut a release from its title:
# feat -> minor, fix/perf -> patch, "!" or "BREAKING CHANGE" -> major, anything else -> no release.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Work out the next version
        id: version
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          current="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          base="${latest_tag#v}"
          base="${base:-$current}"
          next="$(bash .github/scripts/next-version.sh "$TITLE" "$base")"
          # Before the first tag, count from the version the plugin already declares.
          [ -n "$next" ] || echo "No release for: $TITLE"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Bump the plugin version
        if: steps.version.outputs.next != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          current="$(jq -r .version plugin/.claude-plugin/plugin.json)"
          if [ "$current" != "$NEXT" ]; then
            jq --arg v "$NEXT" '.version = $v' plugin/.claude-plugin/plugin.json > plugin.json.tmp
            mv plugin.json.tmp plugin/.claude-plugin/plugin.json
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: release v$NEXT"
            git push origin HEAD:main
          fi

      - name: Tag and publish the release
        if: steps.version.outputs.next != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v$NEXT"
          git push origin "v$NEXT"
          gh release create "v$NEXT" --title "v$NEXT" --generate-notes --verify-tag

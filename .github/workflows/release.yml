name: Release

# When a pull request is merged into main, cut a release from its title:
# feat -> minor, fix/perf -> patch, "!" or "BREAKING CHANGE" -> major, anything else -> no release.
# The workflow only tags and publishes; it never pushes to main, so it works with branch protection.
# The plugin manifest has no version, so installed plugins follow main's commits on their own.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Work out the next version
        id: version
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          base="${latest_tag#v}"
          next="$(bash .github/scripts/next-version.sh "$TITLE" "${base:-0.0.0}")"
          [ -n "$next" ] || echo "No release for: $TITLE"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Tag the merge commit and publish the release
        if: steps.version.outputs.next != ''
        env:
          NEXT: ${{ steps.version.outputs.next }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$NEXT" --target "$SHA" --title "v$NEXT" --generate-notes
